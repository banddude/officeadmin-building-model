[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "officeadmin-building-model"
version = "0.1.0"
description = "Semantic 3D building and electrical modeling engine for OfficeAdmin"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pypdf>=5.9,<7",
    "pdfplumber>=0.11.10,<1",
    "Pillow>=11,<13",
    "fonttools>=4.60,<5",
]

[project.scripts]
oabm-route-checked = "oabm.routing.checked_delivery:main"
oabm-production-sheets = "oabm.drawings.production_set:main"
oabm-single-line = "oabm.drawings.single_line.production:main"
oabm-company-sheets = "oabm.drawings.company_sheets:main"
oabm-site-plan = "oabm.drawings.site_plan:main"
oabm-panel-schedule-sheets = "oabm.drawings.schedule_set:main"
oabm-blank-sheets = "oabm.drawings.blank_set:main"

[project.optional-dependencies]
# Local SVG-to-vector-PDF sheet conversion; native Cairo must be installed.
pdf = ["CairoSVG>=2.9.1,<3"]
# Bounded physical-sheet DXF adapter and repeatability contract.
cad = ["ezdxf>=1.4.4,<1.5"]
ifc = ["ifcopenshell>=0.8.5,<0.9", "numpy>=1.26,<3"]
# camelot-py pulls opencv-python-headless and pypdfium2 itself; the lattice
# flavor runs camelot's vector engine, which needs no ghostscript.
tables = ["camelot-py>=2,<3"]
# Heavier layout-model backend, never installed by CI; its tests skip
# cleanly when docling is absent.
docling = ["docling>=2,<3"]
# Point-set sheet registration (CPD initial fit) and mask-based phase-
# correlation registration. The RANSAC stage is a small numpy
# implementation with a fixed per-call seed; OpenCV's
# estimateAffinePartial2D draws from process-global RNG state and cannot
# honor the byte-identical determinism contract, so it is not used. The
# deterministic phaseCorrelate path covers the pure-translation mask case.
# CI already pulls opencv-python-headless transitively via camelot-py, so
# listing it explicitly adds no new install there.
registration = ["pycpd>=2,<3", "opencv-python-headless>=4,<6"]
dev = [
  "pytest>=8,<10",
  "pytest-xdist>=3,<4",
  "jsonschema>=4.23,<5",
  "ifcopenshell>=0.8.5,<0.9",
  "numpy>=1.26,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
