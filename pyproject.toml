[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "officeadmin-building-model"
version = "0.1.0"
description = "Semantic 3D building and electrical modeling engine for OfficeAdmin"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pypdf>=5.9,<7",
    "pdfplumber>=0.11,<1",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
ifc = ["ifcopenshell>=0.8.5,<0.9", "numpy>=1.26,<3"]
# camelot-py pulls opencv-python-headless and pypdfium2 itself; the lattice
# flavor runs camelot's vector engine, which needs no ghostscript.
tables = ["camelot-py>=2,<3"]
# Heavier layout-model backend, never installed by CI; its tests skip
# cleanly when docling is absent.
docling = ["docling>=2,<3"]
# Point-set sheet registration (CPD initial fit). The RANSAC stage is a
# small numpy implementation with a fixed per-call seed; OpenCV's
# estimateAffinePartial2D draws from process-global RNG state and cannot
# honor the byte-identical determinism contract, so it is not needed here.
registration = ["pycpd>=2,<3"]
dev = [
  "pytest>=8,<10",
  "jsonschema>=4.23,<5",
  "ifcopenshell>=0.8.5,<0.9",
  "numpy>=1.26,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
