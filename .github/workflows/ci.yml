name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # Includes dependency installation as well as the growing full suite.
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,tables,registration]'
      - run: python -m compileall -q src tests
      - name: Report runner parallelism
        run: |
          python - <<'PYCPU'
          import os
          from pathlib import Path
          print(f"logical_cpus={os.cpu_count()}", flush=True)
          if hasattr(os, "sched_getaffinity"):
              print(f"affinity_cpus={len(os.sched_getaffinity(0))}", flush=True)
          quota = Path("/sys/fs/cgroup/cpu.max")
          if quota.exists():
              print(f"cpu_quota={quota.read_text().strip()}", flush=True)
          PYCPU
      - name: Run full suite with timings
        run: >-
          pytest -v -n auto --durations=30 --durations-min=1
          --junitxml=test-results/pytest.xml
      - name: Retain per-test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ github.run_attempt }}
          path: test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 7
