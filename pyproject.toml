[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "officeadmin-building-model"
version = "0.1.0"
description = "Semantic 3D building and electrical modeling engine for OfficeAdmin"
requires-python = ">=3.11"
dependencies = ["pypdf>=5.9,<7", "pdfplumber>=0.11,<1", "Pillow>=11,<13"]

[project.optional-dependencies]
ifc = ["ifcopenshell>=0.8.5,<0.9", "numpy>=1.26,<3"]
dev = [
  "pytest>=8,<10",
  "jsonschema>=4.23,<5",
  "ifcopenshell>=0.8.5,<0.9",
  "numpy>=1.26,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
